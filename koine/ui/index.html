<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>koine walk-around</title>
<style>
  :root { color-scheme: dark; --bg:#0d0f12; --panel:#171a20; --panel2:#1f232b; --fg:#e8eaf0; --dim:#8b93a3; --acc:#0a84ff; --ok:#34c759; --warn:#ffcc00; --bad:#ff3b30; --mute:#ff3b30; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:rgba(13,15,18,.92); backdrop-filter:blur(10px); border-bottom:1px solid #23272f; }
  header h1 { font-size:17px; margin:0; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:var(--panel2); font-size:12px; color:var(--dim); }
  .chip i { width:8px; height:8px; border-radius:50%; background:var(--bad); }
  .chip.on i { background:var(--ok); }
  .chip.link i { background:var(--warn); }
  .chip.link.on i { background:var(--ok); }
  nav { display:flex; gap:8px; padding:10px 16px 0; overflow-x:auto; }
  nav button { flex:0 0 auto; padding:9px 14px; border-radius:10px; border:1px solid #2a2f39; background:var(--panel); color:var(--dim); font-size:14px; }
  nav button.active { background:var(--acc); color:#fff; border-color:var(--acc); }
  main { padding:12px 16px calc(24px + env(safe-area-inset-bottom)); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--panel); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; min-height:210px; position:relative; border-top:4px solid var(--stripe,#3a4150); }
  .card.stale { opacity:.55; }
  .card .label { font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .sub { font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .val { font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; text-align:center; }
  .card .unit { font-size:12px; color:var(--dim); margin-left:3px; }
  .fader { flex:1; display:flex; align-items:center; justify-content:center; min-height:110px; }
  .fader input[type=range] { -webkit-appearance:none; appearance:none; width:140px; height:44px; background:transparent; transform:rotate(-90deg); margin:0; }
  .fader input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; background:linear-gradient(90deg,#2a2f39 0,#2a2f39 100%); }
  .fader input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:44px; height:28px; border-radius:6px; background:#dfe3ea; border:1px solid #9aa3b5; margin-top:-10px; box-shadow:0 2px 6px rgba(0,0,0,.5); }
  .fader input[type=range]::-moz-range-track { height:8px; border-radius:4px; background:#2a2f39; }
  .fader input[type=range]::-moz-range-thumb { width:44px; height:28px; border-radius:6px; background:#dfe3ea; border:1px solid #9aa3b5; }
  .card.wide .fader { min-height:0; }
  .card.wide .fader input[type=range] { transform:none; width:100%; }
  .toggle { flex:1; min-height:110px; border-radius:12px; border:2px solid #2a2f39; background:var(--panel2); color:var(--fg); font-size:20px; font-weight:700; letter-spacing:.5px; }
  .toggle.on { background:var(--mute); border-color:var(--mute); color:#fff; }
  .toggle.on.pos { background:var(--ok); border-color:var(--ok); }
  .text { flex:1; display:flex; align-items:center; }
  .text input { width:100%; padding:12px; border-radius:10px; border:1px solid #2a2f39; background:var(--panel2); color:var(--fg); font-size:16px; -webkit-user-select:text; user-select:text; }
  .swatch { flex:1; border-radius:12px; border:1px solid #2a2f39; }
  .strip { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
  .strip .card { min-height:260px; padding:8px; }
  .strip .toggle { flex:0 0 44px; min-height:44px; font-size:13px; }
  .strip .fader input[type=range] { width:150px; }
  .strip .val { font-size:15px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:18px 0 8px; }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
  .rules { display:flex; flex-direction:column; gap:8px; }
  .rule { background:var(--panel); border-radius:12px; padding:10px 12px; display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; }
  .rule .name { font-weight:600; }
  .rule .cond { font-size:12px; color:var(--dim); font-family:ui-monospace,Menlo,monospace; grid-column:1 / -1; white-space:pre-wrap; }
  .rule .fires { font-variant-numeric:tabular-nums; font-size:13px; color:var(--dim); text-align:right; }
  .rule.hot { outline:2px solid var(--acc); }
  .log { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); background:var(--panel); border-radius:12px; padding:10px 12px; max-height:40vh; overflow:auto; -webkit-user-select:text; user-select:text; }
  .log div b { color:var(--fg); font-weight:600; }
  .toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#2a2f39; color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  select { padding:8px 10px; border-radius:10px; background:var(--panel2); color:var(--fg); border:1px solid #2a2f39; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1 id="title">koine</h1>
  <span id="link" class="chip link"><i></i><span>connecting</span></span>
  <span id="devices"></span>
</header>
<nav id="nav"><button data-view="pins" class="active">Pinned</button></nav>
<main id="main"><div class="empty">Connecting to daemon…</div></main>
<div id="toast" class="toast"></div>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const cards = new Map(); // path -> [update fn], rebuilt on every render()
  const initialView = (location.hash.match(/view=([^&]+)/) || [])[1];
  const state = { nodes: new Map(), tree: null, devices: [], rules: [], ruleLog: [], ui: { pins: [], title: 'Walk-around' }, view: initialView ? decodeURIComponent(initialView) : 'pins', ws: null, id: null, dragging: new Map(), lastSend: new Map(), sendTimers: new Map() };

  // ---------------------------------------------------------------- connection
  let backoff = 500;
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/`);
    state.ws = ws;
    setLink(false, 'connecting');
    ws.onopen = () => {
      backoff = 500;
      ws.send(JSON.stringify({ COMMAND: 'FORMAT', DATA: 'json' }));
      ws.send(JSON.stringify({ COMMAND: 'SNAPSHOT', DATA: '/' }));
      ws.send(JSON.stringify({ COMMAND: 'LISTEN_ALL' }));
      ws.send(JSON.stringify({ COMMAND: 'TREE', DATA: '/' }));
      ws.send(JSON.stringify({ COMMAND: 'RULES' }));
    };
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      switch (msg.COMMAND) {
        case 'HELLO': state.id = msg.DATA.id; state.devices = msg.DATA.devices; renderDevices(); setLink(true, `live · ${state.id}`); break;
        case 'SNAPSHOT': for (const n of msg.DATA) mergeNode(n); render(); break;
        case 'VALUES': case 'SNAPSHOT_VALUES': for (const n of msg.DATA) { mergeNode(n); updateNode(n.path); } break;
        case 'TREE': state.tree = msg.DATA; buildNav(); render(); break;
        case 'DEVICE_STATUS': { const i = state.devices.findIndex((d) => d.id === msg.DATA.id); if (i >= 0) state.devices[i] = msg.DATA; else state.devices.push(msg.DATA); renderDevices(); break; }
        case 'STALE': for (const n of state.nodes.values()) if (n.path.startsWith('/' + msg.DATA.deviceId + '/')) { n.stale = msg.DATA.stale; updateNode(n.path); } break;
        case 'RULES': state.rules = msg.DATA; if (state.view === 'rules') render(); break;
        case 'RULE_FIRED': {
          state.ruleLog.unshift(msg.DATA); state.ruleLog.length = Math.min(state.ruleLog.length, 200);
          const r = state.rules.find((x) => x.name === msg.DATA.rule); if (r) { r.fires++; r.lastFired = msg.DATA.ts; r.lastError = msg.DATA.error; }
          if (state.view === 'rules') render(); else toast(`rule: ${msg.DATA.rule}`);
          break;
        }
        case 'ACK': for (const r of msg.DATA) if (!r.accepted) toast(`${r.path}: ${r.reason}`); break;
        case 'ERROR': toast(msg.DATA); break;
      }
    };
    ws.onclose = () => { setLink(false, 'reconnecting'); setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 5000); };
    ws.onerror = () => ws.close();
  }
  function setLink(on, text) { const el = $('#link'); el.classList.toggle('on', on); $('span', el).textContent = text; }
  function mergeNode(n) { const cur = state.nodes.get(n.path) || { path: n.path }; Object.assign(cur, n); state.nodes.set(n.path, cur); }

  // ---------------------------------------------------------------- metadata (from OSCQuery tree)
  function meta(path) {
    if (!state.tree) return null;
    let cur = state.tree;
    for (const seg of path.split('/').filter(Boolean)) { cur = cur && cur.CONTENTS && cur.CONTENTS[seg]; if (!cur) return null; }
    return cur;
  }
  function kind(m) {
    if (!m) return 'unknown';
    if (m.EXTENDED_TYPE && m.EXTENDED_TYPE[0] === 'color') return 'color';
    if (m.TYPE === 'T' || m.TYPE === 'F') return 'bool';
    if (m.TYPE === 'f' || m.TYPE === 'i') return m.RANGE ? 'range' : 'number';
    return 'string';
  }
  const fmt = (v, m) => { if (v === null || v === undefined) return '—'; if (typeof v === 'number') { const u = m && m.UNIT ? m.UNIT[0] : ''; if (u === 'dB' && v <= (m.RANGE ? m.RANGE[0].MIN : -90)) return '-∞'; return (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1)); } return String(v); };
  const sibling = (path, name) => path.replace(/\/[^/]+$/, '/' + name);

  // ---------------------------------------------------------------- sending
  function send(path, value) {
    if (!state.ws || state.ws.readyState !== 1) return;
    const n = state.nodes.get(path); if (n) { n.value = value; n.source = state.id; }
    // ~30 Hz per-parameter throttle while dragging; trailing send guaranteed.
    const now = performance.now(), last = state.lastSend.get(path) || 0;
    const fire = () => { state.lastSend.set(path, performance.now()); state.ws.send(JSON.stringify({ COMMAND: 'SET', DATA: { path, value } })); };
    clearTimeout(state.sendTimers.get(path));
    if (now - last > 33) fire(); else state.sendTimers.set(path, setTimeout(fire, 33 - (now - last)));
  }

  // ---------------------------------------------------------------- rendering
  function renderDevices() {
    $('#devices').innerHTML = state.devices.map((d) => `<span class="chip ${d.connected ? 'on' : ''}" title="${d.profileName || d.profile} @ ${d.host}"><i></i>${d.name || d.id}</span>`).join(' ');
  }
  function buildNav() {
    const nav = $('#nav');
    nav.innerHTML = '<button data-view="pins">Pinned</button>' + state.devices.map((d) => `<button data-view="dev:${d.id}">${d.name || d.id}</button>`).join('') + '<button data-view="all">Browse</button>' + (state.rules.length ? `<button data-view="rules">Rules (${state.rules.length})</button>` : '');
    for (const b of nav.querySelectorAll('button')) { b.classList.toggle('active', b.dataset.view === state.view); b.onclick = () => { state.view = b.dataset.view; history.replaceState(null, '', '#view=' + encodeURIComponent(state.view)); buildNav(); render(); }; }
  }
  function render() {
    cards.clear();
    const main = $('#main');
    main.innerHTML = '';
    if (state.view === 'pins') return renderPins(main);
    if (state.view.startsWith('dev:')) return renderDevice(main, state.view.slice(4));
    if (state.view === 'rules') return renderRules(main);
    return renderBrowse(main);
  }
  function renderRules(main) {
    const h = document.createElement('h2'); h.textContent = 'Rules · when one device changes, Koine acts on another'; main.appendChild(h);
    const list = document.createElement('div'); list.className = 'rules';
    const now = Date.now();
    for (const r of state.rules) {
      const el = document.createElement('div'); el.className = 'rule' + (r.lastFired && now - r.lastFired < 3000 ? ' hot' : '');
      const doTxt = Array.isArray(r.do) ? r.do.map(fmtAction).join('\n     ') : fmtAction(r.do);
      el.innerHTML = `<div class="name">${esc(r.name)}${r.enabled ? '' : ' (disabled)'}</div><div class="fires">${r.fires} fire${r.fires === 1 ? '' : 's'}${r.lastFired ? ' · ' + new Date(r.lastFired).toLocaleTimeString() : ''}</div><div class="cond">when ${esc(typeof r.when === 'string' ? r.when : JSON.stringify(r.when))}${r.and && r.and.length ? '\n and  ' + r.and.map(esc).join(', ') : ''}\n do   ${esc(doTxt)}${r.lastError ? '\n ERR  ' + esc(r.lastError) : ''}</div>`;
      list.appendChild(el);
    }
    main.appendChild(list);
    const h2 = document.createElement('h2'); h2.textContent = 'Recent fires'; main.appendChild(h2);
    const log = document.createElement('div'); log.className = 'log';
    log.innerHTML = state.ruleLog.length ? state.ruleLog.map((e) => `<div>${new Date(e.ts).toLocaleTimeString()} <b>${esc(e.rule)}</b> ← ${esc(e.trigger)} = ${esc(JSON.stringify(e.value))} → ${esc(e.actions.map(fmtResult).join('; '))}${e.error ? ' <span style="color:var(--bad)">' + esc(e.error) + '</span>' : ''}</div>`).join('') : '<div>nothing fired yet</div>';
    main.appendChild(log);
  }
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const fmtAction = (a) => typeof a === 'string' ? a : JSON.stringify(a);
  const fmtResult = (r) => r.set ? `set ${r.set} = ${JSON.stringify(r.value)}${r.noop ? ' (no change)' : ''}` : r.osc ? `osc ${r.osc} ${r.address}` : r.log ? `log "${r.log}"` : JSON.stringify(r);
  function renderPins(main) {
    if (!state.ui.pins.length) { main.innerHTML = '<div class="empty">No pins configured. Add <code>ui.pins</code> to the daemon config.</div>'; return; }
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const p of state.ui.pins) grid.appendChild(card(p.path, p.label));
    main.appendChild(grid);
  }
  function renderDevice(main, id) {
    const dev = state.devices.find((d) => d.id === id);
    const groups = new Map(); // section -> Map(index -> {fader, mute, name, color})
    for (const n of state.nodes.values()) {
      if (!n.path.startsWith('/' + id + '/')) continue;
      const parts = n.path.split('/').filter(Boolean); // [id, section, idx, param] or [id, section, param]
      const m = meta(n.path); if (!m || !m.EXTENDED_TYPE) continue;
      const role = m.EXTENDED_TYPE[0]; if (!['fader', 'mute', 'name', 'color'].includes(role)) continue;
      const section = parts[1], idx = parts.length === 4 ? parts[2] : (parts.length === 3 ? '' : parts.slice(2, -1).join('/'));
      if (!groups.has(section)) groups.set(section, new Map());
      const g = groups.get(section); if (!g.has(idx)) g.set(idx, {}); g.get(idx)[role] = n.path;
    }
    if (!groups.size) { main.innerHTML = `<div class="empty">${dev ? dev.name : id}: no channel strips in the namespace yet (waiting for device sync)</div>`; return; }
    for (const [section, g] of groups) {
      const h = document.createElement('h2'); h.textContent = `${dev ? dev.name : id} · ${section}`; main.appendChild(h);
      const strip = document.createElement('div'); strip.className = 'strip';
      for (const [idx, roles] of g) strip.appendChild(stripCard(roles, `${section} ${idx}`.trim()));
      main.appendChild(strip);
    }
  }
  function renderBrowse(main) {
    const sel = document.createElement('select');
    const prefixes = new Set();
    for (const p of state.nodes.keys()) { const parts = p.split('/').filter(Boolean); prefixes.add('/' + parts.slice(0, Math.min(2, parts.length - 1)).join('/')); }
    sel.innerHTML = [...prefixes].sort().map((p) => `<option>${p}</option>`).join('');
    sel.value = state.browsePrefix || sel.options[0]?.value;
    sel.onchange = () => { state.browsePrefix = sel.value; render(); };
    main.appendChild(sel);
    const grid = document.createElement('div'); grid.className = 'grid'; grid.style.marginTop = '12px';
    let count = 0;
    for (const n of [...state.nodes.values()].sort((a, b) => a.path.localeCompare(b.path))) {
      if (!n.path.startsWith((sel.value || '') + '/')) continue;
      if (++count > 200) break;
      grid.appendChild(card(n.path, n.path.slice(sel.value.length + 1), true));
    }
    main.appendChild(grid);
  }

  function onUpdate(path, fn) { if (!cards.has(path)) cards.set(path, []); cards.get(path).push(fn); fn(); }
  function updateNode(path) { for (const fn of cards.get(path) || []) fn(); }

  function card(path, label, wide) {
    const el = document.createElement('div'); el.className = 'card' + (wide ? ' wide' : '');
    const m = meta(path); const k = kind(m);
    el.innerHTML = `<div class="label">${label || path}</div><div class="sub">${path}</div>`;
    const nameNode = state.nodes.get(sibling(path, 'name')); const colorNode = state.nodes.get(sibling(path, 'color'));
    const refresh = () => {
      const n = state.nodes.get(path);
      el.classList.toggle('stale', !n || n.stale);
      if (colorNode && colorNode.value) el.style.setProperty('--stripe', colorNode.value);
      if (nameNode && nameNode.value && !label) $('.label', el).textContent = nameNode.value;
      else if (nameNode && nameNode.value) $('.sub', el).textContent = `${nameNode.value} · ${path}`;
    };
    el.appendChild(control(path, m, k));
    onUpdate(path, refresh);
    if (nameNode) onUpdate(nameNode.path, refresh);
    if (colorNode) onUpdate(colorNode.path, refresh);
    return el;
  }
  function stripCard(roles, fallback) {
    const el = document.createElement('div'); el.className = 'card';
    const nameP = roles.name, colorP = roles.color;
    el.innerHTML = `<div class="label">${fallback}</div>`;
    const refresh = () => {
      const nm = nameP && state.nodes.get(nameP); const cl = colorP && state.nodes.get(colorP);
      $('.label', el).textContent = (nm && nm.value) || fallback;
      if (cl && cl.value) el.style.setProperty('--stripe', cl.value);
      const f = roles.fader && state.nodes.get(roles.fader);
      el.classList.toggle('stale', !!(f && f.stale));
    };
    if (roles.fader) el.appendChild(control(roles.fader, meta(roles.fader), 'range'));
    if (roles.mute) el.appendChild(control(roles.mute, meta(roles.mute), 'bool'));
    if (nameP) onUpdate(nameP, refresh); if (colorP) onUpdate(colorP, refresh); if (roles.fader) onUpdate(roles.fader, refresh);
    refresh();
    return el;
  }

  function control(path, m, k) {
    const wrap = document.createElement('div');
    const node = () => state.nodes.get(path) || {};
    if (k === 'range') {
      const min = m.RANGE[0].MIN, max = m.RANGE[0].MAX, unit = m.UNIT ? m.UNIT[0] : '';
      wrap.className = 'fader';
      const val = document.createElement('div'); val.className = 'val';
      const input = document.createElement('input'); input.type = 'range'; input.min = min; input.max = max; input.step = (max - min) > 50 ? 0.1 : 0.01;
      input.oninput = () => { state.dragging.set(path, true); val.innerHTML = `${fmt(Number(input.value), m)}<span class="unit">${unit}</span>`; send(path, Number(input.value)); };
      input.onchange = () => { state.dragging.delete(path); send(path, Number(input.value)); };
      input.onpointerdown = () => state.dragging.set(path, true);
      input.onpointerup = input.onpointercancel = () => state.dragging.delete(path);
      wrap.appendChild(input);
      const outer = document.createElement('div'); outer.style.display = 'contents'; outer.appendChild(wrap); outer.appendChild(val);
      onUpdate(path, () => { const v = node().value; if (v === null || v === undefined) { val.textContent = '—'; return; } if (!state.dragging.get(path)) input.value = v; val.innerHTML = `${fmt(v, m)}<span class="unit">${unit}</span>`; });
      return outer;
    }
    if (k === 'bool') {
      const b = document.createElement('button'); b.className = 'toggle';
      const isMute = /mute/.test(path); const isPos = !isMute;
      if (isPos) b.classList.add('pos');
      const lab = m && m.EXTENDED_TYPE ? m.EXTENDED_TYPE[0] : path.split('/').pop();
      b.onclick = () => send(path, !node().value);
      onUpdate(path, () => { const v = !!node().value; b.classList.toggle('on', v); b.textContent = isMute ? (v ? 'MUTED' : 'ON') : `${lab.toUpperCase()} ${v ? 'ON' : 'OFF'}`; });
      return b;
    }
    if (k === 'color') {
      const sw = document.createElement('div'); sw.className = 'swatch';
      onUpdate(path, () => { sw.style.background = node().value || '#000'; sw.title = node().value || ''; });
      return sw;
    }
    if (k === 'number') {
      const val = document.createElement('div'); val.className = 'val'; val.style.flex = '1'; val.style.display = 'flex'; val.style.alignItems = 'center'; val.style.justifyContent = 'center';
      onUpdate(path, () => { val.textContent = fmt(node().value, m); });
      return val;
    }
    wrap.className = 'text';
    const input = document.createElement('input'); input.type = 'text'; input.maxLength = 32;
    input.onchange = () => send(path, input.value);
    input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
    wrap.appendChild(input);
    onUpdate(path, () => { if (document.activeElement !== input) input.value = node().value ?? ''; });
    return wrap;
  }

  let toastT; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2500); }

  // ---------------------------------------------------------------- boot
  fetch('/api/ui').then((r) => r.json()).then((ui) => { state.ui = { pins: [], ...ui }; $('#title').textContent = ui.title || ui.name || 'koine'; document.title = `${ui.title || ui.name || 'koine'} · koine`; render(); }).catch(() => {});
  connect();
})();
</script>
</body>
</html>
